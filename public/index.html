<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4bff">
<title>Find Someone Who… – Human Bingo</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
<div class="tag"><div class="band">Hello, we’re playing</div><div class="tv">Find Someone Who…</div></div>

<section class="panel">
<h2>Join a room</h2>
<p>Enter the room code on the host’s screen.</p>
<form id="jf">
<label for="code" class="sr">Room code</label>
<input id="code" class="code-in" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE" style="width:100%">
<p class="err" id="err" role="alert"></p>
<button class="btn big block">Join room</button>
</form>
</section>

<section class="panel">
<h2>Host a game</h2>
<p>Build your card, get a short room code, and watch the room fill up live.</p>
<a class="btn alt" href="/host">Create a room</a>
<div id="mine" style="margin-top:14px"></div>
</section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const code = $('#code');
code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
$('#jf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const c = code.value;
  if (!c) { $('#err').textContent = 'Type the room code first.'; return; }
  const r = await fetch('/api/rooms/' + encodeURIComponent(c)).catch(() => null);
  if (!r || !r.ok) { $('#err').textContent = 'No room with that code. Check the code on the host’s screen.'; return; }
  location.href = '/join/' + c;
});
let rooms = [];
try { rooms = JSON.parse(localStorage.getItem('hb2:rooms') || '[]'); } catch (e) {}
if (rooms.length) {
  const box = $('#mine');
  const h = document.createElement('h3'); h.textContent = 'Your rooms on this device'; box.appendChild(h);
  const chips = document.createElement('div'); chips.className = 'chips';
  rooms.slice(0, 8).forEach((r) => {
    const a = document.createElement('a');
    a.className = 'btn alt'; a.href = '/host/' + r.code + '#k=' + r.key;
    a.textContent = r.code + ' · ' + (r.title || 'Room');
    chips.appendChild(a);
  });
  box.appendChild(chips);
}
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
